{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aql.fullname" . }}-dashboard
  labels:
    {{- include "aql.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}{{ toYaml . | nindent 4 }}{{ end }}
  {{- with .Values.dashboard.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  atscale-query-lifecycle.json: |-
{{ .Files.Get "files/atscale-query-lifecycle.json" | indent 4 }}
{{- end }}
